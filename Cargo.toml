[package]
name = "nextgen-studio"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Native OTUI editor with an isolated NextGen preview"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "__screenshot"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
encoding_rs = "0.8"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = "debuginfo"

[profile.dev]
debug = 2
incremental = true
