name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        os: [windows-2022, ubuntu-24.04]
        include:
          - os: windows-2022
            platform: Windows-x64
          - os: ubuntu-24.04
            platform: Linux-x64
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev xvfb xauth
      - name: Install pinned stable Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Rust dependency and build cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: studio-rust-v1-${{ matrix.platform }}-${{ matrix.config }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Format
        run: cargo fmt --check
      - name: Build and test
        run: |
          $profile = if ("${{ matrix.config }}" -eq "Release") { "release" } else { "dev" }
          cargo build --locked --profile $profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --profile $profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: python tools/package.py --platform ${{ matrix.platform }} --config ${{ matrix.config }}
      - name: Test installed application
        run: |
          $binary = if ($IsWindows) { "./staging/bin/nextgen-studio.exe" } else { "./staging/bin/nextgen-studio" }
          if ($IsLinux) {
            $env:LIBGL_ALWAYS_SOFTWARE = "1"
            & xvfb-run -a $binary --smoke-test
          } else {
            & $binary --smoke-test
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path staging/bin/nextgen-studio.log)) { throw "Application did not create its log" }
          if (!(Select-String -Path staging/bin/nextgen-studio.log -SimpleMatch "Desktop smoke passed" -Quiet)) { throw "UI smoke did not finish" }
      - name: Publish binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NextGen-Studio-${{ matrix.platform }}-${{ matrix.config }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - run: gh run download "$GITHUB_RUN_ID" --pattern 'NextGen-Studio-*' --dir artifacts
      - shell: bash
        run: |
          shopt -s globstar nullglob
          packages=(artifacts/**/*.zip artifacts/**/*.sha256)
          test "${#packages[@]}" -eq 8
          gh release create "$RELEASE_TAG" "${packages[@]}" --verify-tag --prerelease --title "NextGen Studio $RELEASE_TAG" --notes-file /dev/stdin <<'NOTES'
          Editor desktop Rust. Windows/Linux x64, Debug/Release. Use Release no dia a dia.
          Extraia o ZIP e execute bin/nextgen-studio. SHA-256 acompanha o ZIP.
          Sem Qt/WebView. Console no Windows Debug; log nos dois modos.
          Prévia nativa experimental requer NextGen configurado. Consulte README.md.
          NOTES
