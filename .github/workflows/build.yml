name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        include:
          - os: windows-2022
            platform: Windows-x64
            arch: win64_msvc2022_64
            archives: qtbase
            cache: sccache
          - os: ubuntu-24.04
            platform: Linux-x64
            arch: linux_gcc_64
            archives: qtbase icu
            cache: ccache
        os: [windows-2022, ubuntu-24.04]
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf xvfb xauth libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - name: Qt SDK (precompiled, cached)
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          archives: ${{ matrix.archives }}
          cache: true
          cache-key-prefix: studio-qt-v1
          install-deps: true
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          variant: ${{ matrix.cache }}
          key: studio-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.config }}-qt6.8.3
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.cache }} -DSTUDIO_DEPLOY_RUNTIME=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Tests
        run: ctest --test-dir build/ci --output-on-failure --output-junit test-results.xml
      - name: Install and package
        run: |
          cmake --install build/ci --prefix "$PWD/staging"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package.py --platform ${{ matrix.platform }} --config ${{ matrix.config }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Packaged application smoke test
        run: |
          $binary = if ($IsWindows) { "./staging/bin/nextgen-studio.exe" } else { "./staging/bin/nextgen-studio" }
          $qtPath = $env:QT_ROOT_DIR
          if ($qtPath) {
            $env:PATH = (($env:PATH -split [IO.Path]::PathSeparator) | Where-Object { !$_.StartsWith($qtPath, [StringComparison]::OrdinalIgnoreCase) }) -join [IO.Path]::PathSeparator
          }
          Remove-Item Env:QT_PLUGIN_PATH, Env:QT_QPA_PLATFORM_PLUGIN_PATH, Env:LD_LIBRARY_PATH -ErrorAction SilentlyContinue
          if ($IsLinux) {
            $env:QT_QPA_PLATFORM = "xcb"
            & xvfb-run -a $binary --smoke-test --screenshot smoke.png
          } else {
            & $binary --smoke-test --screenshot smoke.png
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path smoke.png)) { throw "Screenshot was not produced" }
      - name: Publish binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NextGen-Studio-${{ matrix.platform }}-${{ matrix.config }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.config }}
          path: |
            smoke.png
            build/ci/test-results.xml
            build/ci/Testing/Temporary/LastTest.log
          retention-days: 14

  release:
    name: Publish preview release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download tested packages
        run: gh run download "$GITHUB_RUN_ID" --pattern 'NextGen-Studio-*' --dir artifacts
      - name: Publish tagged preview
        shell: bash
        run: |
          shopt -s globstar nullglob
          packages=(artifacts/**/*.zip artifacts/**/*.sha256)
          test "${#packages[@]}" -eq 8
          gh release create "$RELEASE_TAG" "${packages[@]}" --verify-tag --prerelease --title "NextGen Studio $RELEASE_TAG" --notes "Previa inicial do editor desktop. Windows/Linux x64, Debug e Release. Use Release no dia a dia. Extraia o ZIP e execute bin/nextgen-studio. Linux: Ubuntu 24.04 ou ambiente compativel com glibc 2.39+. Windows Debug requer runtime de depuracao MSVC. O canvas e um esquema aproximado; integracao de previa nativa experimental. Consulte README.md e BUILD.json."